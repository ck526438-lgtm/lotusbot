name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pandas numpy matplotlib yfinance pytest
      - run: pytest -q
      - name: Backtest sur données réelles EURUSD H1 (Yahoo)
        continue-on-error: true
        run: python -m lotusbot backtest --out report
