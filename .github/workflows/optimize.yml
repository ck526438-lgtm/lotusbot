name: Optimisation (données réelles)

on:
  workflow_dispatch:
    inputs:
      split:
        description: "Part in-sample (0.7 = 70 %)"
        default: "0.7"
      min_trades:
        description: "Trades minimum in-sample"
        default: "40"

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy matplotlib yfinance
      - name: Optimisation avec validation hors échantillon
        run: python -m lotusbot.optimize --split ${{ inputs.split }} --min-trades ${{ inputs.min_trades }} --out optim
      - uses: actions/upload-artifact@v4
        with:
          name: optimisation
          path: optim/
